name: yefhamak

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: yefhamak
      POSTGRES_PASSWORD: local-dev-only
      POSTGRES_DB: yefhamak
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yefhamak -d yefhamak"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: .
    command: ["sh", "-c", "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://yefhamak:local-dev-only@db:5432/yefhamak
      DIRECT_URL: postgresql+psycopg://yefhamak:local-dev-only@db:5432/yefhamak
      DEMO_API_KEY: ${DEMO_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      LIVE_CHAT_ENABLED: ${COMPOSE_LIVE_CHAT_ENABLED:-false}
      LLM_MODEL: ${LLM_MODEL:-nvidia/nemotron-3-ultra-550b-a55b:free}
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health/db', timeout=3).close()"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  postgres_data:
