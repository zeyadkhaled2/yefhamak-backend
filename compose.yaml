name: yefhamak

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: yefhamak
      POSTGRES_PASSWORD: local-dev-only
      POSTGRES_DB: yefhamak
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yefhamak -d yefhamak"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres_data:
