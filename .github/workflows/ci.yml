name: Backend CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  offline-tests:
    name: Offline tests (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Settings must parse, but no PostgreSQL service or credentials are needed.
      DATABASE_URL: postgresql+psycopg://ci:ci@127.0.0.1:1/unused?connect_timeout=1
      DIRECT_URL: postgresql+psycopg://ci:ci@127.0.0.1:1/unused?connect_timeout=1
      OPENROUTER_API_KEY: ""
      DEMO_API_KEY: ci-only-not-a-real-key
      LIVE_CHAT_ENABLED: "false"
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install application and test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile Python modules
        run: python -m compileall -q app scripts evals tests alembic
      - name: Run offline tests
        shell: bash
        run: |
          mkdir -p test-results
          python -m unittest discover -s tests/unit -v 2>&1 | tee test-results/backend-tests.txt
      - name: Save test output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
